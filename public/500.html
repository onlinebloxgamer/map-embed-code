<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fafafa">
  <title>Server Error – Map Embed Code</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    html { color: #171717; background: #fafafa; font-family: Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; background: #fafafa url('/map-background.webp') center top / cover fixed no-repeat; }
    a:focus-visible, button:focus-visible { outline: 2px solid #0070f3; outline-offset: 3px; }
    .header { height: 57px; border-bottom: 1px solid #ebebeb; background: rgba(250,250,250,.94); }
    .header-inner { display: flex; align-items: center; width: min(1200px, calc(100% - 40px)); height: 100%; margin: auto; }
    .logo { display: inline-flex; align-items: center; gap: 8px; color: #205e38; font-size: 15px; font-weight: 700; text-decoration: none; }
    .logo svg { flex: none; }
    main { display: grid; min-height: calc(100vh - 57px); padding: 48px 20px; place-items: center; }
    .card { width: min(620px, 100%); padding: clamp(26px, 6vw, 48px); border: 1px solid rgba(255,255,255,.82); border-radius: 16px; background: rgba(255,255,255,.95); box-shadow: 0 18px 55px rgba(32,94,56,.13); text-align: center; backdrop-filter: blur(10px); }
    .signal { position: relative; display: grid; width: 112px; height: 112px; margin: 0 auto 24px; border: 1px solid #c9ddce; border-radius: 50%; background: #f3f8f4; place-items: center; }
    .signal::before, .signal::after { position: absolute; border: 2px solid #2f7d4a; border-radius: 50%; content: ''; opacity: .28; }
    .signal::before { inset: 12px; }
    .signal::after { inset: 25px; }
    .pin { position: relative; z-index: 1; width: 30px; height: 38px; }
    .eyebrow { color: #c50000; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(29px, 6vw, 42px); line-height: 1.1; letter-spacing: -.04em; }
    p { max-width: 480px; margin: 0 auto 24px; color: #4d4d4d; font-size: 16px; line-height: 25px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .button { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; padding: 8px 15px; border: 1px solid transparent; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; }
    .primary { color: #fff; background: #2f7d4a; }
    .primary:hover { background: #205e38; }
    .secondary { color: #171717; border-color: #ebebeb; background: #fff; }
    .secondary:hover { background: #f2f2f2; }
    .note { margin: 24px 0 0; padding-top: 18px; border-top: 1px solid #ebebeb; color: #8f8f8f; font-size: 12px; line-height: 18px; }
    @media (max-width: 480px) { .actions { align-items: stretch; flex-direction: column; } .button { width: 100%; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/" aria-label="Map Embed Code home">
        <svg width="30" height="26" viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M1.5 8 9.5 4.5l6 3 8-3.5 5 4v12l-8 3.5-6-3.5-8 4-5-4V8Z" fill="#dcecdf" stroke="#205e38" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M9.5 4.5V17l-3 7m9-16.5-1 13M23.5 4l-3 19.5" stroke="#5f9fa6" stroke-width="2" stroke-linejoin="round"/>
          <path d="M18.5 1.5a5 5 0 0 0-5 4.92C13.5 10.08 18.5 15 18.5 15s5-4.92 5-8.58a5 5 0 0 0-5-4.92Z" fill="#d94b3f" stroke="#fff" stroke-width="1.2"/>
          <circle cx="18.5" cy="6.5" r="1.7" fill="#fff"/>
        </svg>
        <span>Map Embed Code</span>
      </a>
    </div>
  </header>
  <main>
    <section class="card" aria-labelledby="error-title">
      <div class="signal" aria-hidden="true">
        <svg class="pin" viewBox="0 0 30 38"><path d="M15 1C7.3 1 1 7.1 1 14.7 1 24.9 15 37 15 37s14-12.1 14-22.3C29 7.1 22.7 1 15 1Z" fill="#d94b3f" stroke="#fff" stroke-width="2"/><path d="m10 10 10 10m0-10L10 20" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/></svg>
      </div>
      <span class="eyebrow">Error 500</span>
      <h1 id="error-title">Something went off route</h1>
      <p>The server could not complete this request. Your map settings are safe in the URL—try again, or return to the generator.</p>
      <div class="actions">
        <button class="button primary" type="button" onclick="window.location.reload()">Try again</button>
        <a class="button secondary" href="/#generator">Back to the generator</a>
      </div>
      <div class="note">If the problem continues, wait a moment and reload the page.</div>
    </section>
  </main>
</body>
</html>
