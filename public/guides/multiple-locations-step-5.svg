<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Choose Embed on my site</title>
  <desc id="desc">Illustration of the My Maps menu with Embed on my site highlighted and an iframe code dialog.</desc>
  <rect width="1200" height="675" fill="#edf4ed"/>
  <rect x="48" y="42" width="1104" height="591" rx="22" fill="#dcebdc"/>
  <rect x="70" y="64" width="388" height="547" rx="16" fill="#fff"/>
  <text x="104" y="119" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202124">Store locations</text>
  <circle cx="410" cy="110" r="22" fill="#f3f4f3"/><circle cx="410" cy="99" r="3"/><circle cx="410" cy="110" r="3"/><circle cx="410" cy="121" r="3"/>
  <rect x="119" y="137" width="310" height="330" rx="10" fill="#fff" stroke="#dfe4df" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="19" fill="#3c4043"><text x="148" y="185">New map</text><text x="148" y="233">Copy map</text><text x="148" y="281">Print map</text><text x="148" y="329">Export to KML/KMZ</text></g>
  <rect x="135" y="353" width="278" height="66" rx="9" fill="#dcecdf"/>
  <text x="274" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#205e38">Embed on my site</text>
  <rect x="520" y="130" width="584" height="402" rx="16" fill="#fff" stroke="#dfe4df" stroke-width="2"/>
  <text x="560" y="191" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202124">Embed this map</text>
  <text x="560" y="237" font-family="Arial,sans-serif" font-size="17" fill="#5f6368">Copy the HTML and paste it into your website.</text>
  <rect x="560" y="274" width="504" height="124" rx="10" fill="#f7f7f7" stroke="#d9d9d9"/>
  <text x="582" y="312" font-family="monospace" font-size="15" fill="#3c4043">&lt;iframe src="https://www.google.com/</text><text x="582" y="340" font-family="monospace" font-size="15" fill="#3c4043">maps/d/embed?mid=..." width="640"</text><text x="582" y="368" font-family="monospace" font-size="15" fill="#3c4043">height="480"&gt;&lt;/iframe&gt;</text>
  <rect x="897" y="430" width="167" height="50" rx="25" fill="#2f7d4a"/><text x="980" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">COPY HTML</text>
  <rect x="126" y="344" width="294" height="84" rx="14" fill="none" stroke="#c8a85a" stroke-width="5"/>
  <circle cx="421" cy="345" r="24" fill="#c8a85a"/><text x="421" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">5</text>
</svg>
